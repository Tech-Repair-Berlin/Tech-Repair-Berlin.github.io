<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Repair Berlin | Expertos en iPhone</title>
    <style>
        :root {
            --primary: #000000;
            --accent: #2997ff;
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }
        header {
            background-color: var(--card-bg);
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 1px 10px rgba(0,0,0,0.05);
        }
        h1 { margin: 0; font-size: 2.5rem; font-weight: 700; letter-spacing: -1px; }
        .subtitle { color: var(--text-muted); font-size: 1.2rem; margin-top: 5px; }
        
        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-3px); }
        h2 { font-size: 1.5rem; margin-top: 0; }
        
        select, input, textarea {
            width: 100%;
            padding: 14px;
            margin: 10px 0 20px;
            border-radius: 12px;
            border: 1px solid #d2d2d7;
            background-color: #fafafa;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background-color: var(--accent);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0071e3; }
        
        .price-box {
            display: none;
            background: #fcfcfc;
            border: 1px solid #e5e5ea;
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
            animation: fadeIn 0.4s ease;
        }
        .price-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e5e5ea;
        }
        .price-item:last-child { border-bottom: none; }
        .price-value { font-weight: 600; font-size: 1.1rem; color: var(--primary); }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Tech Repair Berlin</h1>
        <div class="subtitle">Servicio técnico experto en iPhone</div>
    </header>

    <div class="container">
        
        <div class="card">
            <h2>Consulta nuestras tarifas</h2>
            <select id="iphoneSelect" onchange="updatePrices()">
                <option value="">Selecciona tu modelo...</option>
                <option value="13">iPhone 13</option>
                <option value="14">iPhone 14</option>
                <option value="15">iPhone 15</option>
                <option value="16">iPhone 16</option>
                <option value="17">iPhone 17</option>
            </select>

            <div id="priceDisplay" class="price-box">
                <div class="price-item">
                    <span>Sustitución de Pantalla Original</span>
                    <span id="valPantalla" class="price-value"></span>
                </div>
                <div class="price-item">
                    <span>Sustitución de Batería</span>
                    <span id="valBateria" class="price-value"></span>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Pide tu cita o consúltanos</h2>
            <form>
                <input type="text" placeholder="Nombre completo" required>
                <input type="email" placeholder="Correo electrónico" required>
                <textarea rows="4" placeholder="Detalla el problema de tu dispositivo..." required></textarea>
                <button type="button">Enviar Solicitud</button>
            </form>
        </div>
    </div>

    <script>
        const tarifasIphone = {
            "13": { pantalla: "120€", bateria: "65€" },
            "14": { pantalla: "150€", bateria: "75€" },
            "15": { pantalla: "180€", bateria: "85€" },
            "16": { pantalla: "210€", bateria: "95€" },
            "17": { pantalla: "250€", bateria: "110€" }
        };

        function updatePrices() {
            const select = document.getElementById("iphoneSelect").value;
            const display = document.getElementById("priceDisplay");
            
            if (select) {
                document.getElementById("valPantalla").innerText = tarifasIphone[select].pantalla;
                document.getElementById("valBateria").innerText = tarifasIphone[select].bateria;
                display.style.display = "block";
            } else {
                display.style.display = "none";
            }
        }
    </script>
</body>
</html>
