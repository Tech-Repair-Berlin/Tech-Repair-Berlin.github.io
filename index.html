<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Repair Berlin - Reparación de iPhone</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1f1f1f;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 2px solid #333;
        }
        h1 { margin: 0; color: #fff; font-size: 28px; }
        p.subtitle { color: #aaa; font-size: 16px; margin-top: 5px; }
        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }
        .tarjeta {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border: 1px solid #2a2a2a;
        }
        h2 { margin-top: 0; color: #fff; font-size: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px;}
        label { font-weight: bold; margin-bottom: 10px; display: block; color: #ccc; }
        select, input, textarea, button {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
        }
        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: #007aff;
        }
        button {
            background-color: #007aff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            transition: background-color 0.3s;
            margin-bottom: 0;
        }
        button:hover { background-color: #0056b3; }
        #resultados {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background-color: #252525;
            border-left: 4px solid #007aff;
            border-radius: 8px;
        }
        .precio-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }
        .precio-item:last-child {
            border-bottom: none;
        }
        .precio-valor {
            font-size: 1.2em;
            font-weight: bold;
            color: #fff;
        }
        .icono {
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Tech Repair Berlin</h1>
        <p class="subtitle">Especialistas en tu iPhone</p>
    </header>

    <div class="container">
        <!-- Calculadora de precios -->
        <div class="tarjeta">
            <h2>Calcula tu reparación</h2>
            <label for="modeloIphone">Selecciona tu modelo:</label>
            <select id="modeloIphone" onchange="calcularPrecio()">
                <option value="">-- Elige un iPhone --</option>
                <option value="13">iPhone 13</option>
                <option value="14">iPhone 14</option>
                <option value="15">iPhone 15</option>
                <option value="16">iPhone 16</option>
                <option value="17">iPhone 17</option>
            </select>

            <div id="resultados">
                <h3 id="nombreModelo" style="margin-top: 0; color: #007aff;"></h3>
                <div class="precio-item">
                    <span><span class="icono">📱</span> Cambio de Pantalla:</span>
                    <span id="precioPantalla" class="precio-valor"></span>
                </div>
                <div class="precio-item">
                    <span><span class="icono">🔋</span> Cambio de Batería:</span>
                    <span id="precioBateria" class="precio-valor"></span>
                </div>
            </div>
        </div>

        <!-- Formulario de contacto -->
        <div class="tarjeta">
            <h2>Contáctanos</h2>
            <form>
                <input type="text" placeholder="Tu nombre" required>
                <input type="email" placeholder="Tu correo electrónico" required>
                <textarea rows="4" placeholder="¿Qué le ocurre a tu dispositivo?" required></textarea>
                <button type="button">Enviar Mensaje</button>
            </form>
        </div>
    </div>

    <script>
        const precios = {
            "13": { pantalla: "120€", bateria: "65€" },
            "14": { pantalla: "150€", bateria: "75€" },
            "15": { pantalla: "180€", bateria: "85€" },
            "16": { pantalla: "210€", bateria: "95€" },
            "17": { pantalla: "250€", bateria: "110€" }
        };

        function calcularPrecio() {
            const modelo = document.getElementById("modeloIphone").value;
            const resultados = document.getElementById("resultados");
            
            if (modelo) {
                document.getElementById("nombreModelo").innerText = "Precios para iPhone " + modelo;
                document.getElementById("precioPantalla").innerText = precios[modelo].pantalla;
                document.getElementById("precioBateria").innerText = precios[modelo].bateria;
                resultados.style.display = "block";
            } else {
                resultados.style.display = "none";
            }
        }
    </script>
</body>
</html>
